<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moje sekcije i fajlovi</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #172033;
      --panel-light: #202d46;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --danger: #dc2626;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #0b1120, var(--bg));
      color: var(--text);
    }

    .container {
      width: min(1150px, 92%);
      margin: 0 auto;
      padding: 35px 0 60px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }

    h1, h2, h3, p { margin-top: 0; }

    h1 {
      margin-bottom: 8px;
      font-size: clamp(2rem, 5vw, 3rem);
    }

    header p, .empty, .section-description {
      color: var(--muted);
    }

    button, .button {
      border: 0;
      border-radius: 10px;
      padding: 11px 15px;
      background: var(--accent);
      color: white;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: background .2s, transform .2s;
    }

    button:hover, .button:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    button.secondary {
      background: var(--panel-light);
      border: 1px solid var(--border);
    }

    button.danger {
      background: #7f1d1d;
    }

    button.small, .button.small {
      padding: 8px 11px;
      font-size: .85rem;
    }

    input[type="file"] { display: none; }

    .sections {
      display: grid;
      gap: 22px;
    }

    .section-card {
      background: rgba(23, 32, 51, .96);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      min-width: 0;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 15px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
      padding-bottom: 17px;
      margin-bottom: 18px;
    }

    .section-title {
      margin: 0 0 7px;
      font-size: 1.4rem;
      overflow-wrap: anywhere;
    }

    .section-description {
      margin: 0;
      font-size: .9rem;
    }

    .section-actions, .file-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .files {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 13px;
    }

    .file-card {
      background: #0f1a2d;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      min-width: 0;
    }

    .file-card h3 {
      font-size: 1rem;
      margin-bottom: 7px;
      overflow-wrap: anywhere;
    }

    .file-meta {
      color: var(--muted);
      font-size: .82rem;
      margin-bottom: 12px;
    }

    .preview {
      width: 100%;
      max-height: 190px;
      object-fit: contain;
      border-radius: 8px;
      background: #080f1d;
      margin-bottom: 12px;
    }

    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      max-height: 180px;
      overflow: auto;
      padding: 10px;
      border-radius: 8px;
      background: #080f1d;
      color: #c7d2fe;
      font-size: .78rem;
      margin: 0 0 12px;
    }

    .empty {
      text-align: center;
      padding: 25px 10px;
      border: 1px dashed var(--border);
      border-radius: 10px;
    }

    .empty-all {
      text-align: center;
      padding: 70px 20px;
      border: 1px dashed var(--border);
      border-radius: 16px;
      color: var(--muted);
    }

    .empty-all h2 {
      color: var(--text);
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: .85rem;
      margin-top: 30px;
    }

    @media (max-width: 600px) {
      .container { width: 94%; padding-top: 24px; }
      .section-card { padding: 16px; }
      header { align-items: stretch; }
      header .button { text-align: center; }
    }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <div>
        <h1>Moje sekcije</h1>
        <p>Organizuj svoje kodove, screenshotove i druge fajlove.</p>
      </div>
      <button id="addSectionBtn" type="button">+ Dodaj sekciju</button>
    </header>

    <section id="sections" class="sections">
      <div class="empty-all" id="emptyState">
        <h2>Još nema sekcija</h2>
        <p>Dodaj prvu sekciju i počni da ubacuješ fajlove.</p>
        <button id="emptyAddBtn" type="button">+ Dodaj prvu sekciju</button>
      </div>
    </section>

    <footer>
      Fajlovi se čuvaju samo tokom ove sesije u browseru. Osvežavanje stranice ih briše.
    </footer>
  </main>

  <script>
    const sectionsContainer = document.getElementById("sections");
    const addSectionBtn = document.getElementById("addSectionBtn");
    const emptyAddBtn = document.getElementById("emptyAddBtn");

    let sections = [];
    let sectionCounter = 0;

    const codeExtensions = [
      "html", "css", "js", "jsx", "ts", "tsx", "py", "java",
      "cpp", "c", "cs", "php", "json", "xml", "md", "txt", "sql", "sh", "bat"
    ];

    function getExtension(name) {
      const parts = name.toLowerCase().split(".");
      return parts.length > 1 ? parts.pop() : "";
    }

    function getFileType(file) {
      if (file.type.startsWith("image/")) return "image";
      if (codeExtensions.includes(getExtension(file.name))) return "code";
      return "other";
    }

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + " B";
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
      return (bytes / (1024 * 1024)).toFixed(1) + " MB";
    }

    function makeId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2);
    }

    function addSection() {
      sectionCounter++;
      sections.push({
        id: makeId(),
        name: "Nova sekcija " + sectionCounter,
        files: []
      });
      render();
    }

    function renameSection(section) {
      const newName = prompt("Unesi novo ime sekcije:", section.name);
      if (newName && newName.trim()) {
        section.name = newName.trim();
        render();
      }
    }

    function deleteSection(sectionId) {
      const section = sections.find(item => item.id === sectionId);
      if (!section) return;

      const confirmed = confirm(
        `Da li stvarno želiš da obrišeš sekciju "${section.name}" i sve fajlove u njoj?`
      );

      if (!confirmed) return;

      section.files.forEach(file => URL.revokeObjectURL(file.url));
      sections = sections.filter(item => item.id !== sectionId);
      render();
    }

    function addFilesToSection(section, selectedFiles) {
      for (const file of selectedFiles) {
        const duplicate = section.files.some(
          item => item.name === file.name &&
                  item.size === file.size &&
                  item.lastModified === file.lastModified
        );

        if (!duplicate) {
          section.files.push({
            id: makeId(),
            file,
            name: file.name,
            type: getFileType(file),
            size: file.size,
            url: URL.createObjectURL(file)
          });
        }
      }
      render();
    }

    function removeFile(section, fileId) {
      const file = section.files.find(item => item.id === fileId);
      if (file) URL.revokeObjectURL(file.url);

      section.files = section.files.filter(item => item.id !== fileId);
      render();
    }

    function createFileCard(section, item) {
      const card = document.createElement("article");
      card.className = "file-card";

      const title = document.createElement("h3");
      title.textContent = item.name;

      const meta = document.createElement("div");
      meta.className = "file-meta";
      meta.textContent = `${item.type.toUpperCase()} · ${formatSize(item.size)}`;

      card.append(title, meta);

      if (item.type === "image") {
        const image = document.createElement("img");
        image.className = "preview";
        image.src = item.url;
        image.alt = "Pregled fajla " + item.name;
        card.appendChild(image);
      } else if (item.type === "code") {
        const pre = document.createElement("pre");
        pre.textContent = "Učitavanje pregleda...";
        card.appendChild(pre);

        item.file.text().then(text => {
          pre.textContent = text.slice(0, 12000) || "(Prazan fajl)";
        }).catch(() => {
          pre.textContent = "Pregled nije dostupan.";
        });
      }

      const actions = document.createElement("div");
      actions.className = "file-actions";

      const download = document.createElement("a");
      download.className = "button small";
      download.href = item.url;
      download.download = item.name;
      download.textContent = "Preuzmi";

      const remove = document.createElement("button");
      remove.className = "danger small";
      remove.type = "button";
      remove.textContent = "Obriši";
      remove.addEventListener("click", () => removeFile(section, item.id));

      actions.append(download, remove);
      card.appendChild(actions);

      return card;
    }

    function createSectionCard(section) {
      const card = document.createElement("article");
      card.className = "section-card";

      const sectionHeader = document.createElement("div");
      sectionHeader.className = "section-header";

      const titleArea = document.createElement("div");

      const title = document.createElement("h2");
      title.className = "section-title";
      title.textContent = section.name;

      const description = document.createElement("p");
      description.className = "section-description";
      description.textContent =
        `${section.files.length} fajl${section.files.length === 1 ? "" : "ova"}`;

      titleArea.append(title, description);

      const sectionActions = document.createElement("div");
      sectionActions.className = "section-actions";

      const fileInput = document.createElement("input");
      fileInput.type = "file";
      fileInput.multiple = true;
      fileInput.id = "input-" + section.id;
      fileInput.accept =
        ".html,.css,.js,.jsx,.ts,.tsx,.py,.java,.cpp,.c,.cs,.php,.json,.xml,.md,.txt,.sql,.sh,.bat,.png,.jpg,.jpeg,.gif,.webp,.svg";

      const addFilesLabel = document.createElement("label");
      addFilesLabel.className = "button small";
      addFilesLabel.htmlFor = fileInput.id;
      addFilesLabel.textContent = "+ Dodaj fajlove";

      fileInput.addEventListener("change", event => {
        addFilesToSection(section, event.target.files);
        fileInput.value = "";
      });

      const rename = document.createElement("button");
      rename.className = "secondary small";
      rename.type = "button";
      rename.textContent = "Preimenuj";
      rename.addEventListener("click", () => renameSection(section));

      const deleteBtn = document.createElement("button");
      deleteBtn.className = "danger small";
      deleteBtn.type = "button";
      deleteBtn.textContent = "Obriši sekciju";
      deleteBtn.addEventListener("click", () => deleteSection(section.id));

      sectionActions.append(addFilesLabel, rename, deleteBtn, fileInput);
      sectionHeader.append(titleArea, sectionActions);
      card.appendChild(sectionHeader);

      const filesContainer = document.createElement("div");
      filesContainer.className = "files";

      if (section.files.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "Ova sekcija još nema fajlova. Klikni na „+ Dodaj fajlove“.";
        filesContainer.appendChild(empty);
      } else {
        section.files.forEach(item => {
          filesContainer.appendChild(createFileCard(section, item));
        });
      }

      card.appendChild(filesContainer);
      return card;
    }

    function render() {
      sectionsContainer.innerHTML = "";

      if (sections.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-all";

        const heading = document.createElement("h2");
        heading.textContent = "Još nema sekcija";

        const text = document.createElement("p");
        text.textContent = "Dodaj prvu sekciju i počni da ubacuješ fajlove.";

        const button = document.createElement("button");
        button.type = "button";
        button.textContent = "+ Dodaj prvu sekciju";
        button.addEventListener("click", addSection);

        empty.append(heading, text, button);
        sectionsContainer.appendChild(empty);
        return;
      }

      sections.forEach(section => {
        sectionsContainer.appendChild(createSectionCard(section));
      });
    }

    addSectionBtn.addEventListener("click", addSection);
    emptyAddBtn.addEventListener("click", addSection);

    render();
  </script>
</body>
</html>
