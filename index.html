<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Javne sekcije i fajlovi</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg:#0f172a; --panel:#172033; --panel2:#202d46; --border:#334155;
      --text:#f8fafc; --muted:#94a3b8; --accent:#3b82f6; --danger:#b91c1c;
    }
    *{box-sizing:border-box}
    body{margin:0;background:linear-gradient(135deg,#0b1120,var(--bg));color:var(--text);font-family:Arial,sans-serif}
    .container{width:min(1100px,92%);margin:auto;padding:34px 0 60px}
    header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:28px}
    h1{margin:0 0 8px;font-size:clamp(2rem,5vw,3rem)}
    p{color:var(--muted)}
    button,.button{border:0;border-radius:10px;padding:11px 15px;background:var(--accent);color:#fff;font-weight:bold;cursor:pointer;text-decoration:none;display:inline-block}
    button:hover,.button:hover{filter:brightness(1.12)}
    button.secondary{background:var(--panel2);border:1px solid var(--border)}
    button.danger{background:var(--danger)}
    button:disabled{opacity:.5;cursor:not-allowed}
    input[type=file]{display:none}
    .notice{background:#172554;border:1px solid #1d4ed8;padding:13px 15px;border-radius:12px;margin-bottom:22px;color:#dbeafe}
    .sections{display:grid;gap:22px}
    .section{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:22px}
    .section-header{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:16px;margin-bottom:18px}
    h2{margin:0 0 7px;overflow-wrap:anywhere}
    .muted{color:var(--muted);font-size:.9rem}
    .actions,.file-actions{display:flex;gap:8px;flex-wrap:wrap}
    .small{padding:8px 11px;font-size:.85rem}
    .files{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
    .file{background:#0f1a2d;border:1px solid var(--border);border-radius:12px;padding:14px;min-width:0}
    .file h3{font-size:1rem;overflow-wrap:anywhere;margin:0 0 7px}
    .preview{width:100%;max-height:210px;object-fit:contain;background:#080f1d;border-radius:8px;margin:8px 0 12px}
    pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:180px;overflow:auto;background:#080f1d;color:#c7d2fe;border-radius:8px;padding:10px;font-size:.8rem}
    .empty{text-align:center;border:1px dashed var(--border);border-radius:12px;padding:30px;color:var(--muted)}
    .status{margin:15px 0;color:#bfdbfe;min-height:20px}
    .modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:20px}
    .modal.open{display:flex}
    .modal-box{width:min(430px,100%);background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:22px}
    .modal-box input{width:100%;padding:12px;border:1px solid var(--border);border-radius:9px;background:#0f1a2d;color:var(--text);margin:10px 0 16px}
    @media(max-width:600px){.container{width:94%;padding-top:24px}.section{padding:16px}}
  </style>
</head>
<body>
<main class="container">
  <header>
    <div>
      <h1>Moje sekcije</h1>
      <p>Javni prostor za organizovanje i deljenje fajlova.</p>
    </div>
    <button id="addSectionBtn">+ Dodaj sekciju</button>
  </header>

  <div class="notice">
    Sadržaj je javan. Svako ko vidi ovaj sajt može da pregleda fajlove.
    Za dodavanje i brisanje koristi se javni ključ samo za dozvole koje podesiš u Supabase-u.
  </div>

  <div id="status" class="status"></div>
  <section id="sections" class="sections"></section>
</main>

<div id="modal" class="modal">
  <div class="modal-box">
    <h2>Nova sekcija</h2>
    <label for="sectionName">Naziv sekcije</label>
    <input id="sectionName" maxlength="100" placeholder="Npr. HTML projekti" />
    <div class="actions">
      <button id="confirmSection">Kreiraj</button>
      <button class="secondary" id="cancelSection">Otkaži</button>
    </div>
  </div>
</div>

<script>
  // 1) U Supabase projektu idi na Project Settings > API.
  // 2) Zameni sledeće dve vrednosti svojim Project URL-om i anon public key-em.
  const SUPABASE_URL = "PASTE_YOUR_SUPABASE_URL_HERE";
  const SUPABASE_ANON_KEY = "PASTE_YOUR_SUPABASE_ANON_KEY_HERE";
  const BUCKET = "public-files";

  const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const sectionsEl = document.getElementById("sections");
  const statusEl = document.getElementById("status");
  const modal = document.getElementById("modal");
  const sectionName = document.getElementById("sectionName");

  let sections = [];

  function status(message, error = false) {
    statusEl.textContent = message;
    statusEl.style.color = error ? "#fca5a5" : "#bfdbfe";
  }

  function escapePath(name) {
    return name.replace(/[^a-zA-Z0-9._-]/g, "_");
  }

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
    return (bytes / (1024 * 1024)).toFixed(1) + " MB";
  }

  async function loadSections() {
    status("Učitavanje...");
    const { data, error } = await client
      .from("sections")
      .select("id,name,created_at,files(id,name,path,size,mime_type,created_at)")
      .order("created_at", { ascending: true });

    if (error) {
      status("Greška pri učitavanju: " + error.message, true);
      return;
    }

    sections = data || [];
    render();
    status("");
  }

  function render() {
    sectionsEl.innerHTML = "";

    if (!sections.length) {
      sectionsEl.innerHTML = '<div class="empty"><h2>Nema sekcija</h2><p>Klikni na „+ Dodaj sekciju“ da napraviš prvu.</p></div>';
      return;
    }

    sections.forEach(section => {
      const card = document.createElement("article");
      card.className = "section";

      const header = document.createElement("div");
      header.className = "section-header";

      const titleArea = document.createElement("div");
      const title = document.createElement("h2");
      title.textContent = section.name;
      const count = document.createElement("div");
      count.className = "muted";
      count.textContent = `${(section.files || []).length} fajlova`;
      titleArea.append(title, count);

      const actions = document.createElement("div");
      actions.className = "actions";

      const input = document.createElement("input");
      input.type = "file";
      input.multiple = true;
      input.id = "files-" + section.id;
      input.accept = ".html,.css,.js,.jsx,.ts,.tsx,.py,.java,.cpp,.c,.cs,.php,.json,.xml,.md,.txt,.sql,.png,.jpg,.jpeg,.gif,.webp,.svg";

      const label = document.createElement("label");
      label.className = "button small";
      label.htmlFor = input.id;
      label.textContent = "+ Dodaj fajlove";
      input.addEventListener("change", e => uploadFiles(section, e.target.files));

      const rename = document.createElement("button");
      rename.className = "secondary small";
      rename.textContent = "Preimenuj";
      rename.onclick = () => renameSection(section);

      const remove = document.createElement("button");
      remove.className = "danger small";
      remove.textContent = "Obriši sekciju";
      remove.onclick = () => deleteSection(section);

      actions.append(label, rename, remove, input);
      header.append(titleArea, actions);
      card.appendChild(header);

      const filesEl = document.createElement("div");
      filesEl.className = "files";

      if (!section.files?.length) {
        filesEl.innerHTML = '<div class="empty">Ova sekcija nema fajlova.</div>';
      } else {
        section.files.forEach(file => filesEl.appendChild(createFileCard(section, file)));
      }

      card.appendChild(filesEl);
      sectionsEl.appendChild(card);
    });
  }

  function createFileCard(section, file) {
    const card = document.createElement("article");
    card.className = "file";

    const title = document.createElement("h3");
    title.textContent = file.name;

    const meta = document.createElement("div");
    meta.className = "muted";
    meta.textContent = `${formatSize(file.size || 0)} · ${file.mime_type || "fajl"}`;
    card.append(title, meta);

    const publicUrl = client.storage.from(BUCKET).getPublicUrl(file.path).data.publicUrl;

    if ((file.mime_type || "").startsWith("image/")) {
      const image = document.createElement("img");
      image.className = "preview";
      image.src = publicUrl;
      image.alt = file.name;
      card.appendChild(image);
    } else if ((file.mime_type || "").startsWith("text/") || /\.(html|css|js|json|py|java|cpp|c|md|txt|sql)$/i.test(file.name)) {
      const pre = document.createElement("pre");
      pre.textContent = "Učitavanje pregleda...";
      card.appendChild(pre);
      fetch(publicUrl).then(r => r.text()).then(text => {
        pre.textContent = text.slice(0, 12000) || "(Prazan fajl)";
      }).catch(() => pre.textContent = "Pregled nije dostupan.");
    }

    const actions = document.createElement("div");
    actions.className = "file-actions";

    const download = document.createElement("a");
    download.className = "button small";
    download.href = publicUrl;
    download.target = "_blank";
    download.rel = "noopener";
    download.textContent = "Otvori / preuzmi";

    const remove = document.createElement("button");
    remove.className = "danger small";
    remove.textContent = "Obriši";
    remove.onclick = () => deleteFile(section, file);

    actions.append(download, remove);
    card.appendChild(actions);
    return card;
  }

  async function addSection() {
    const name = sectionName.value.trim();
    if (!name) return;

    status("Kreiranje sekcije...");
    const { error } = await client.from("sections").insert({ name });
    if (error) {
      status("Greška: " + error.message, true);
      return;
    }

    modal.classList.remove("open");
    sectionName.value = "";
    await loadSections();
  }

  async function renameSection(section) {
    const name = prompt("Novo ime sekcije:", section.name);
    if (!name || !name.trim()) return;

    const { error } = await client.from("sections").update({ name: name.trim() }).eq("id", section.id);
    if (error) status("Greška: " + error.message, true);
    else await loadSections();
  }

  async function deleteSection(section) {
    if (!confirm(`Obrisati sekciju „${section.name}“ i sve njene fajlove?`)) return;

    for (const file of section.files || []) {
      await client.storage.from(BUCKET).remove([file.path]);
    }

    const { error } = await client.from("sections").delete().eq("id", section.id);
    if (error) status("Greška: " + error.message, true);
    else await loadSections();
  }

  async function uploadFiles(section, selectedFiles) {
    for (const file of selectedFiles) {
      status(`Šaljem ${file.name}...`);
      const path = `${section.id}/${Date.now()}-${escapePath(file.name)}`;

      const upload = await client.storage.from(BUCKET).upload(path, file, {
        contentType: file.type || "application/octet-stream",
        upsert: false
      });

      if (upload.error) {
        status("Greška pri slanju: " + upload.error.message, true);
        continue;
      }

      const insert = await client.from("files").insert({
        section_id: section.id,
        name: file.name,
        path,
        size: file.size,
        mime_type: file.type || "application/octet-stream"
      });

      if (insert.error) {
        await client.storage.from(BUCKET).remove([path]);
        status("Greška pri čuvanju podataka: " + insert.error.message, true);
      }
    }

    await loadSections();
  }

  async function deleteFile(section, file) {
    if (!confirm(`Obrisati fajl „${file.name}“?`)) return;

    const storageResult = await client.storage.from(BUCKET).remove([file.path]);
    if (storageResult.error) {
      status("Greška: " + storageResult.error.message, true);
      return;
    }

    const { error } = await client.from("files").delete().eq("id", file.id);
    if (error) status("Greška: " + error.message, true);
    else await loadSections();
  }

  document.getElementById("addSectionBtn").onclick = () => {
    sectionName.value = "";
    modal.classList.add("open");
    sectionName.focus();
  };
  document.getElementById("cancelSection").onclick = () => modal.classList.remove("open");
  document.getElementById("confirmSection").onclick = addSection;
  modal.addEventListener("click", e => { if (e.target === modal) modal.classList.remove("open"); });

  if (SUPABASE_URL.includes("PASTE_") || SUPABASE_ANON_KEY.includes("PASTE_")) {
    status("Prvo unesi Supabase URL i anon public key u kodu.", true);
  } else {
    loadSections();
  }
</script>
</body>
</html>
